<script>


const API =
'https://script.google.com/macros/s/AKfycbzqGxLm9iH2tdU9j3gVpurHmWEr0m2mPBGs9T6tCmX53WGijRH-3MN1AtL4uPrQNJft/exec';


let accessPin =
  localStorage.getItem(
    'warehousePin'
  ) || '';


let catalog =
  [];


let qr =
  null;


let cameraStarted =
  false;


let ocrWorker =
  null;


let ocrReady =
  false;


let ocrBusy =
  false;


let serverBusy =
  false;


let pendingBarcode =
  '';


let cooldownUntil =
  0;


let lastBarcode =
  '';


let lastBarcodeTime =
  0;


let lastArticle =
  '';


let lastArticleTime =
  0;



/* =========================
   API JSONP
========================= */

function api(action, params = {}) {
  return new Promise(function(resolve, reject) {
    const callback = '__rims_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    const script = document.createElement('script');
    const waitMs = action === 'ping' ? 30000 : 90000;
    let settled = false;
    const timer = setTimeout(function() {
      finish(new Error('Нет ответа на «' + action + '» за ' + (waitMs / 1000) +
        ' сек. ' + (action === 'ping' ? 'Проверьте адрес /exec и доступ к веб-приложению.' :
        'Проверьте последнее выполнение doGet в Apps Script → Выполнения. Если операция меняет данные, проверьте результат в таблице перед повтором.')));
    }, waitMs);
    function finish(error, data) {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      script.remove();
      // A late response must not cause an uncaught ReferenceError.
      window[callback] = function() {};
      setTimeout(function() { delete window[callback]; }, 300000);
      if (error) reject(error); else resolve(data);
    }
    window[callback] = function(data) {
      if (data && data.ok) finish(null, data);
      else finish(new Error('Запрос «' + action + '»: ' + (data && data.error || 'неверный ответ сервера')));
    };
    script.onerror = function() {
      finish(new Error('Не загрузился ответ «' + action + '». Проверьте адрес /exec и доступ к веб-приложению.'));
    };
    script.onload = function() {
      if (!settled) finish(new Error('Запрос «' + action + '»: ответ загрузился, но callback не вызван. Проверьте адрес и версию развёртывания.'));
    };
    const query = new URLSearchParams(Object.assign({}, params, {
      action: action, pin: accessPin, callback: callback, _: Date.now()
    }));
    script.src = API + '?' + query.toString();
    document.body.appendChild(script);
  });
}

/* =========================
   LOGIN
========================= */

async function login() {

  const value =
    document
      .getElementById(
        'pin'
      )
      .value
      .trim();


  if (!value) {
    return;
  }


  accessPin =
    value;


  try {

    const response =
      await api(
        'init'
      );


    localStorage
      .setItem(
        'warehousePin',
        accessPin
      );


    initApp(
      response.data
    );

  }

  catch(err) {

    if (
      String(
        err.message
      )
      .includes(
        'BAD_PIN'
      )
    ) {

      alert(
        'Неверный PIN'
      );

    }

    else {

      alert(
        err.message
      );
    }
  }
}


/* =========================
   INIT
========================= */

function initApp(
  data
) {

  catalog =
    data.catalog ||
    [];


  document
    .getElementById(
      'shipment'
    )
    .textContent =
    '📦 ' +
    data.shipmentName;


  updateSummary(
    data.summary
  );


  document
    .getElementById(
      'login'
    )
    .classList
    .add(
      'hidden'
    );


  document
    .getElementById(
      'app'
    )
    .classList
    .remove(
      'hidden'
    );
}


/* =========================
   CAMERA
========================= */

async function startCamera() {

  if (
    cameraStarted
  ) {
    return;
  }


  try {

    setStatus(
      'Запрашиваю камеру…',
      'search'
    );


    document
      .getElementById(
        'camera'
      )
      .classList
      .remove(
        'hidden'
      );


    const formats = [

      Html5QrcodeSupportedFormats
        .EAN_13,

      Html5QrcodeSupportedFormats
        .EAN_8,

      Html5QrcodeSupportedFormats
        .UPC_A,

      Html5QrcodeSupportedFormats
        .UPC_E,

      Html5QrcodeSupportedFormats
        .CODE_128,

      Html5QrcodeSupportedFormats
        .CODE_39,

      Html5QrcodeSupportedFormats
        .ITF
    ];


    qr =
      new Html5Qrcode(
        'reader',
        {
          formatsToSupport:
            formats
        }
      );


    const cameras =
      await Html5Qrcode
        .getCameras();


    if (
      !cameras ||
      !cameras.length
    ) {

      throw new Error(
        'Камера не найдена'
      );
    }


    const back =
      cameras.find(
        function(cam) {

          return /back|rear|environment|зад/i
            .test(
              cam.label ||
              ''
            );
        }
      )
      ||
      cameras[
        cameras.length - 1
      ];


    await qr.start(

      back.id,

      {
        fps:
          12,

        qrbox: (w,h) => ({width:Math.min(310,Math.floor(w*.85)),height:Math.min(150,Math.floor(h*.5))})
      },

      barcodeFound,

      function() {}
    );


    cameraStarted =
      true;


    document
      .getElementById(
        'start'
      )
      .classList
      .add(
        'hidden'
      );


    document
      .getElementById(
        'ocrButton'
      )
      .classList
      .remove(
        'hidden'
      );


    setStatus(

      'Камера работает.<br><br>' +
      'Наведи на этикетку товара.',

      'search'
    );


    initOcr();

  }

  catch(err) {

    setStatus(

      '❌ Камера не запустилась:<br><br>' +
      escapeHtml(
        err.message ||
        String(err)
      ) +
      '<br><br>' +
      'Открой страницу в Chrome или Safari ' +
      'и разреши доступ к камере.',

      'bad'
    );
  }
}


/* =========================
   BARCODE
========================= */

async function barcodeFound(
  code
) {

  const now =
    Date.now();


  if (
    now <
    cooldownUntil
  ) {
    return;
  }


  if (
    serverBusy
  ) {
    return;
  }


  if (
    pendingBarcode ===
    code
  ) {
    return;
  }


  if (
    code ===
      lastBarcode &&
    now -
      lastBarcodeTime
    <
    2500
  ) {
    return;
  }


  lastBarcode =
    code;


  lastBarcodeTime =
    now;


  serverBusy =
    true;


  vibrate(
    70
  );


  setStatus(

    '📦 Штрихкод:<br><b>' +
    escapeHtml(
      code
    ) +
    '</b><br><br>' +
    'Проверяю…',

    'search'
  );


  try {

    const response =
      await api(

        'scan',

        {
          barcode:
            code
        }
      );


    handleResult(
      response.result
    );

  }

  catch(err) {

    serverBusy =
      false;


    showError(
      err
    );
  }
}


/* =========================
   OCR INIT
========================= */

async function initOcr() {

  try {

    setStatus(

      'Камера работает.<br>' +
      'Загружаю распознавание артикулов…',

      'search'
    );


    ocrWorker =
      await Tesseract
        .createWorker(
          'eng'
        );


    await ocrWorker
      .setParameters({

        tessedit_char_whitelist:
          'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-./ ',

        preserve_interword_spaces:
          '1'
      });


    ocrReady =
      true;


    setStatus(

      '✅ Готово.<br><br>' +
      'Наведи камеру на штрихкод ' +
      'или напечатанный артикул.',

      'search'
    );


    setInterval(
      function() {

        runOcr(
          false
        );

      },
      1900
    );

  }

  catch(err) {

    setStatus(

      '⚠️ OCR не загрузился, ' +
      'но штрихкоды можно сканировать.',

      'warn'
    );
  }
}


/* =========================
   CAMERA FRAME
========================= */

// Reuse canvas and limit OCR size; retain the entire image for multiline labels.
let ocrFrameCanvas=null, ocrFramePass=0;
function getFrame() {
  const video=document.querySelector('#reader video');
  if(!video || !video.videoWidth || video.readyState<2)return null;
  if(!ocrFrameCanvas)ocrFrameCanvas=document.createElement('canvas');
  const canvas=ocrFrameCanvas, ctx=canvas.getContext('2d',{willReadFrequently:true});
  const scale=Math.min(1.5,1280/Math.max(video.videoWidth,video.videoHeight));
  const w=Math.round(video.videoWidth*scale),h=Math.round(video.videoHeight*scale);
  if(canvas.width!==w || canvas.height!==h){canvas.width=w;canvas.height=h;}
  ctx.drawImage(video,0,0,w,h);
  const pass=ocrFramePass++%3;
  if(pass===0)return canvas;
  const frame=ctx.getImageData(0,0,w,h),d=frame.data,hist=new Uint32Array(256);
  for(let i=0;i<d.length;i+=4){const v=(77*d[i]+150*d[i+1]+29*d[i+2])>>8;hist[v]++;}
  const pixels=w*h;let sum=0,lo=0,hi=255;
  for(let i=0;i<256;i++){sum+=hist[i];if(sum>=pixels*.02){lo=i;break;}}
  sum=0;for(let i=255;i>=0;i--){sum+=hist[i];if(sum>=pixels*.02){hi=i;break;}}
  const span=Math.max(30,hi-lo);
  for(let i=0;i<d.length;i+=4){
    let v=Math.max(0,Math.min(255,(((77*d[i]+150*d[i+1]+29*d[i+2])>>8)-lo)*255/span));
    if(pass===2)v=255-v;
    d[i]=d[i+1]=d[i+2]=v;
  }
  ctx.putImageData(frame,0,0);return canvas;
}

/* =========================
   OCR
========================= */

async function runOcr(
  forced
) {

  if (
    !ocrReady ||
    ocrBusy ||
    serverBusy
  ) {
    return;
  }


  if (
    !forced &&
    Date.now() <
      cooldownUntil
  ) {
    return;
  }


  const frame =
    getFrame();


  if (!frame) {
    return;
  }


  ocrBusy =
    true;


  try {

    const result =
      await ocrWorker
        .recognize(
          frame
        );


    const text =
      result.data.text ||
      '';


    const match =
      findArticle(
        text
      );


    if (!match) {

      if (forced) {

        setStatus(

          '🔍 Артикул не найден.<br><br>' +
          'Поднеси этикетку ближе и держи ровно.',

          'warn'
        );
      }


      return;
    }


    const now =
      Date.now();


    if (
      match.article ===
        lastArticle &&
      now -
        lastArticleTime
      <
      2600
    ) {
      return;
    }


    lastArticle =
      match.article;


    lastArticleTime =
      now;


    serverBusy =
      true;


    setStatus(

      '🔍 Найден артикул:<br>' +

      '<b>' +
      escapeHtml(
        match.article
      ) +
      '</b><br>' +

      escapeHtml(
        match.name
      ) +

      '<br><br>Проверяю…',

      'search'
    );


    let response;


    if (
      pendingBarcode
    ) {

      response =
        await api(

          'bind',

          {
            barcode:
              pendingBarcode,

            article:
              match.article
          }
        );

    }

    else {

      response =
        await api(

          'ocr',

          {
            article:
              match.article
          }
        );
    }


    handleResult(
      response.result
    );

  }

  catch(err) {

    serverBusy =
      false;


    showError(
      err
    );

  }

  finally {

    ocrBusy =
      false;
  }
}


/* =========================
   OCR MATCH
========================= */

function normalize(
  value
) {

  return String(
    value || ''
  )
    .toUpperCase()
    .replace(
      /[^A-ZА-Я0-9]/g,
      ''
    );
}


function getCandidates(
  text
) {

  const parts =
    String(
      text || ''
    )
      .toUpperCase()
      .replace(
        /[^A-ZА-Я0-9\-./\s]/g,
        ' '
      )
      .split(/\s+/)
      .map(
        normalize
      )
      .filter(Boolean);


  const set =
    new Set();


  for (
    let i = 0;
    i < parts.length;
    i++
  ) {

    for (
      let count = 1;
      count <= 6;
      count++
    ) {

      if (
        i + count >
        parts.length
      ) {
        break;
      }


      const value =
        parts
          .slice(
            i,
            i + count
          )
          .join('');


      if (
        value.length >= 3
      ) {

        set.add(
          value
        );
      }
    }
  }


  return [
    ...set
  ];
}


function findArticle(
  text
) {

  const full =
    normalize(
      text
    );


  const candidates =
    getCandidates(
      text
    );


  const matches =
    [];


  catalog.forEach(
    function(item) {

      const article =
        normalize(
          item.article
        );


      if (!article) {
        return;
      }


      const numeric =
        /^\d+$/
          .test(
            article
          );


      let found =
        false;


      /*
       * Короткие цифровые артикула
       * нельзя искать внутри EAN.
       */
      if (
        numeric &&
        article.length <= 6
      ) {

        found =
          candidates
            .includes(
              article
            );

      }

      else {

        found =
          full.includes(
            article
          )
          ||
          candidates.includes(
            article
          );
      }


      if (found) {

        matches.push({

          article:
            item.article,

          name:
            item.name,

          length:
            article.length
        });
      }
    }
  );


  if (
    !matches.length
  ) {
    return null;
  }


  matches.sort(
    function(a, b) {

      return (
        b.length -
        a.length
      );
    }
  );


  return matches[0];
}


/* =========================
   RESULT
========================= */

function handleResult(
  res
) {

  serverBusy =
    false;


  if (
    res.summary
  ) {

    updateSummary(
      res.summary
    );
  }


  if (
    res.type ===
    'unknown'
  ) {

    pendingBarcode =
      res.barcode;


    setStatus(

      '📦 Штрихкод считан:<br>' +

      '<b>' +
      escapeHtml(
        res.barcode
      ) +
      '</b><br><br>' +

      'Теперь автоматически ищу ' +
      'артикул на этой же этикетке.',

      'warn'
    );


    setTimeout(
      function() {

        runOcr(
          true
        );

      },
      100
    );


    return;
  }


  if (
    res.type ===
      'complete'
    ||
    res.type ===
      'partial'
  ) {

    const complete =
      res.type ===
      'complete';


    setStatus(

      (
        complete
          ?
          '✅ '
          :
          '🟡 '
      ) +

      '<b>' +
      escapeHtml(
        res.name
      ) +
      '</b><br><br>' +

      'Артикул: <b>' +
      escapeHtml(
        res.article
      ) +
      '</b><br>' +

      'Нужно: ' +
      res.expected +
      '<br>' +

      'Принято: <b>' +
      res.accepted +
      '</b><br>' +

      'Осталось: <b>' +
      res.remaining +
      '</b>',

      complete
        ?
        'ok'
        :
        'warn'
    );


    pendingBarcode =
      '';


    cooldownUntil =
      Date.now() +
      2800;


    vibrate(
      [80,60,80]
    );


    return;
  }


  if (
    res.type ===
    'extra'
  ) {

    setStatus(

      '⚠️ <b>ЛИШНЯЯ ЕДИНИЦА</b><br><br>' +

      escapeHtml(
        res.name
      ) +

      '<br>Уже принято: ' +
      res.accepted +
      ' из ' +
      res.expected,

      'bad'
    );


    pendingBarcode =
      '';


    cooldownUntil =
      Date.now() +
      3500;


    return;
  }


  if (
    res.type ===
    'conflict'
  ) {

    setStatus(

function escapeHtml(
  value
) {

  return String(
    value || ''
  )
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )

      />/g,
      '&gt;'

      /"/g,
      '&quot;'

}

        cameraClearFrames=0;cameraClearSince=0;
        setStatus('В кадре несколько товаров. Оставьте одну этикетку.','warn');
      }else if(!text.trim()){confirmCameraRead('',0);cameraObserveEmpty();}else {confirmCameraRead('',0);cameraClearFrames=0;cameraClearSince=0;showReadout(text,scanMode==='accept'?'Текст прочитан, но совпадения в выбранных поставках нет. Проверьте даты поставок и артикул.':'Текст прочитан, но точного совпадения в каталоге нет. Можно ввести артикул вручную.');}
    }
    if(!action&&forced)setStatus('Не удалось однозначно распознать артикул. Наведите камеру на одну этикетку и нажмите ещё раз.','warn');
  }catch(e){showError(e);}finally{ocrBusy=false;}
  if(action)await action();
};
let forceRecognitionBusy=false;
async function recognizeArticleNow(){
  if(forceRecognitionBusy)return;
  if(serverBusy||manualBusy){setStatus('Дождитесь завершения добавления текущего товара.','warn');return;}
  if(retryRequired){setStatus('Сначала завершите незавершённый возврат.','warn');return;}
  if(scanMode==='accept'&&!selectedBatches){setStatus('Сначала выберите магазин, дату и начните приёмку.','warn');return;}
  if(scanMode==='returns'&&!returnSheetId){setStatus('Сначала выберите лист отчёта.','warn');return;}
  if(!ocrReady){setStatus('Распознавание ещё загружается. Повторите через несколько секунд.','warn');return;}
  forceRecognitionBusy=true;modeEpoch++;
  const button=el('recognizeArticleButton');button.disabled=true;
  setStatus('Распознаю артикул следующего товара…','search');
  try{
    const deadline=Date.now()+15000;
    while(ocrBusy && Date.now()<deadline)await new Promise(resolve=>setTimeout(resolve,100));
    if(ocrBusy){setStatus('Камера ещё обрабатывает кадр. Нажмите снова через несколько секунд.','warn');return;}
    cameraLastKey='';cameraLastBarcode='';cameraClearFrames=0;cameraClearSince=0;
    stableCameraKey='';stableCameraCount=0;pendingBarcode='';scanArmed=true;
    await runOcr(true);
  }catch(e){showError(e);}finally{forceRecognitionBusy=false;button.disabled=false;}
}
let manualBusy=false;
async function manualScan(){
  if(manualBusy||forceRecognitionBusy)return;
  if(retryRequired){setStatus('Сначала завершите незавершённый возврат кнопкой повтора или отмены.','warn');return;}
  if(serverBusy){setStatus('Предыдущая операция ещё выполняется. Дождитесь результата и нажмите «Добавить».','warn');return;}
  const input=el('manualCode'), text=input.value.trim();
  if(!text){setStatus('Введите артикул, затем нажмите «Добавить».','warn');input.focus();return;}
  // Invalidate the in-flight OCR frame; manual input does not wait for OCR.
  modeEpoch++;
  const wasArmed=scanArmed;scanArmed=false;manualBusy=true;
  const button=el('manualAdd');button.disabled=true;button.textContent='Добавляю…';
  try{
    if(scanMode==='returns'){
      if(!returnSheetId){setStatus('Сначала выберите лист отчёта для возврата.','warn');return;}
      if(el('scanKind').value==='order')await findReturn('',text,'');
      else{
        const m=exactMatches(text,returnCatalog);
        if(m.length>1){setStatus('Этот артикул есть у нескольких брендов. Введите бренд и артикул.','warn');return;}
        await findReturn(m.length?m[0].article:text,el('orderFilter').value.trim(),m.length?m[0].brandKey:'');
      }
    }else{
      if(!selectedBatches){setStatus('Выберите магазин и дату, затем нажмите «Начать приёмку».','warn');return;}
      const m=exactMatches(text,acceptCatalog);
      if(m.length!==1){setStatus('Укажите артикул и бренд из выбранной поставки.','warn');return;}
      await acceptItem(m[0],'');
    }
  }catch(e){showError(e);}
  finally{
    manualBusy=false;button.disabled=false;button.textContent='Добавить';
    if(!retryRequired)scanArmed=wasArmed;
  }
}

</script>

<script>
/* Connection fix 2026-10-26: staged startup, visible errors, no write retries. */
const connectionNote = document.createElement('div');
connectionNote.style.cssText='white-space:pre-wrap;padding:12px;margin-top:10px;color:#dce8ff;overflow-wrap:anywhere';
connectionNote.setAttribute('role','status');
document.getElementById('login').appendChild(connectionNote);
let connecting = false;
login = async function() {
  if (connecting) return;
  const input = document.getElementById('pin');
  const value = input.value.trim();
  if (!value) { connectionNote.textContent='Введите PIN.'; return; }
  connecting = true; accessPin = value;
  const buttons = [...document.getElementById('login').querySelectorAll('button')];
  buttons.forEach(b=>b.disabled=true);
  let stage = 'ping';
  const started = Date.now();
  const tick = () => { connectionNote.textContent =
    (stage === 'ping' ? 'Проверяю связь… ' : 'Связь есть. Загружаю поставки… ') +
    Math.floor((Date.now()-started)/1000) + ' сек.'; };
  tick(); const interval = setInterval(tick, 1000);
  try {
    await api('ping');
    stage = 'init'; tick();
    const response = await api('init');
    if (!response.data || !Array.isArray(response.data.batches))
      throw new Error('Сервер вернул неожиданный формат поставок. Проверьте развёртывание сканера.');
    localStorage.setItem('warehousePin', accessPin);
    initApp(response.data);
    connectionNote.textContent='';
  } catch(error) {
    connectionNote.textContent=error.message;
    if (String(error.message).includes('BAD_PIN')) {
      localStorage.removeItem('warehousePin'); accessPin='';
    }
  } finally {
    clearInterval(interval); connecting=false;
    buttons.forEach(b=>b.disabled=false);
  }
};
window.onload = function() {
  connectionNote.textContent='Подключение • версия исправления 26.10';
  if (accessPin) { document.getElementById('pin').value=accessPin; login(); }
};
</script>
