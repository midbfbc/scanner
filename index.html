<script>


const API =
'https://script.google.com/macros/s/AKfycby83Hxy4yg9Gtv5UaObBTqHJ4fu_9Vy5Fwuc-E6Hy9tKV09Q9z2MUpkanFRYNsI_J8r/exec';


let accessPin =
  localStorage.getItem(
    'warehousePin'
  ) || '';


let catalog =
  [];


let qr =
  null;


let cameraStarted =
  false;


let ocrWorker =
  null;


let ocrReady =
  false;


let ocrBusy =
  false;


let serverBusy =
  false;


let pendingBarcode =
  '';


let cooldownUntil =
  0;


let lastBarcode =
  '';


let lastBarcodeTime =
  0;


let lastArticle =
  '';


let lastArticleTime =
  0;



/* =========================
   API JSONP
========================= */

function api(
  action,
  params = {}
) {

  return new Promise(
    function(
      resolve,
      reject
    ) {


      const callback =
        '__cb_' +
        Date.now() +
        '_' +
        Math.random()
          .toString(36)
          .slice(2);


      const script =
        document
          .createElement(
            'script'
          );


      const timeout =
        setTimeout(
          function() {

            cleanup();

            reject(
              new Error(
                'Apps Script не ответил'
              )
            );

          },
          20000
        );


      function cleanup() {

        clearTimeout(
          timeout
        );


        try {

          delete window[
            callback
          ];

        } catch(e) {}


        if (
          script.parentNode
        ) {

          script
            .parentNode
            .removeChild(
              script
            );
        }
      }


      window[
        callback
      ] =
        function(data) {

          cleanup();


          if (
            data &&
            data.ok
          ) {

            resolve(
              data
            );

          }

          else {

            reject(
              new Error(
                data &&
                data.error
                  ?
                  data.error
                  :
                  'Ошибка API'
              )
            );
          }
        };


      const query =
        new URLSearchParams(
          Object.assign(
            {
              action:
                action,

              pin:
                accessPin,

              callback:
                callback,

              _:
                Date.now()
            },
            params
          )
        );


      script.src =
        API +
        '?' +
        query.toString();


      script.onerror =
        function() {

          cleanup();

          reject(
            new Error(
              'Не удалось подключиться к Apps Script'
            )
          );
        };


      document
        .body
        .appendChild(
          script
        );

    }
  );
}


/* =========================
   LOGIN
========================= */

async function login() {

  const value =
    document
      .getElementById(
        'pin'
      )
      .value
      .trim();


  if (!value) {
    return;
  }


  accessPin =
    value;


  try {

    const response =
      await api(
        'init'
      );


    localStorage
      .setItem(
        'warehousePin',
        accessPin
      );


    initApp(
      response.data
    );

  }

  catch(err) {

    if (
      String(
        err.message
      )
      .includes(
        'BAD_PIN'
      )
    ) {

      alert(
        'Неверный PIN'
      );

    }

    else {

      alert(
        err.message
      );
    }
  }
}


/* =========================
   INIT
========================= */

function initApp(
  data
) {

  catalog =
    data.catalog ||
    [];


  document
    .getElementById(
      'shipment'
    )
    .textContent =
    '📦 ' +
    data.shipmentName;


  updateSummary(
    data.summary
  );


  document
    .getElementById(
      'login'
    )
    .classList
    .add(
      'hidden'
    );


  document
    .getElementById(
      'app'
    )
    .classList
    .remove(
      'hidden'
    );
}


/* =========================
   CAMERA
========================= */

async function startCamera() {

  if (
    cameraStarted
  ) {
    return;
  }


  try {

    setStatus(
      'Запрашиваю камеру…',
      'search'
    );


    document
      .getElementById(
        'camera'
      )
      .classList
      .remove(
        'hidden'
      );


    const formats = [

      Html5QrcodeSupportedFormats
        .EAN_13,

      Html5QrcodeSupportedFormats
        .EAN_8,

      Html5QrcodeSupportedFormats
        .UPC_A,

      Html5QrcodeSupportedFormats
        .UPC_E,

      Html5QrcodeSupportedFormats
        .CODE_128,

      Html5QrcodeSupportedFormats
        .CODE_39,

      Html5QrcodeSupportedFormats
        .ITF
    ];


    qr =
      new Html5Qrcode(
        'reader',
        {
          formatsToSupport:
            formats
        }
      );


    const cameras =
      await Html5Qrcode
        .getCameras();


    if (
      !cameras ||
      !cameras.length
    ) {

      throw new Error(
        'Камера не найдена'
      );
    }


    const back =
      cameras.find(
        function(cam) {

          return /back|rear|environment|зад/i
            .test(
              cam.label ||
              ''
            );
        }
      )
      ||
      cameras[
        cameras.length - 1
      ];


    await qr.start(

      back.id,

      {
        fps:
          12,

        qrbox: {
          width:
            310,
          height:
            150
        }
      },

      barcodeFound,

      function() {}
    );


    cameraStarted =
      true;


    document
      .getElementById(
        'start'
      )
      .classList
      .add(
        'hidden'
      );


    document
      .getElementById(
        'ocrButton'
      )
      .classList
      .remove(
        'hidden'
      );


    setStatus(

      'Камера работает.<br><br>' +
      'Наведи на этикетку товара.',

      'search'
    );


    initOcr();

  }

  catch(err) {

    setStatus(

      '❌ Камера не запустилась:<br><br>' +
      escapeHtml(
        err.message ||
        String(err)
      ) +
      '<br><br>' +
      'Открой страницу в Chrome или Safari ' +
      'и разреши доступ к камере.',

      'bad'
    );
  }
}


/* =========================
   BARCODE
========================= */

async function barcodeFound(
  code
) {

  const now =
    Date.now();


  if (
    now <
    cooldownUntil
  ) {
    return;
  }


  if (
    serverBusy
  ) {
    return;
  }


  if (
    pendingBarcode ===
    code
  ) {
    return;
  }


  if (
    code ===
      lastBarcode &&
    now -
      lastBarcodeTime
    <
    2500
  ) {
    return;
  }


  lastBarcode =
    code;


  lastBarcodeTime =
    now;


  serverBusy =
    true;


  vibrate(
    70
  );


  setStatus(

    '📦 Штрихкод:<br><b>' +
    escapeHtml(
      code
    ) +
    '</b><br><br>' +
    'Проверяю…',

    'search'
  );


  try {

    const response =
      await api(

        'scan',

        {
          barcode:
            code
        }
      );


    handleResult(
      response.result
    );

  }

  catch(err) {

    serverBusy =
      false;


    showError(
      err
    );
  }
}


/* =========================
   OCR INIT
========================= */

async function initOcr() {

  try {

    setStatus(

      'Камера работает.<br>' +
      'Загружаю распознавание артикулов…',

      'search'
    );


    ocrWorker =
      await Tesseract
        .createWorker(
          'eng'
        );


    await ocrWorker
      .setParameters({

        tessedit_char_whitelist:
          'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-./ ',

        preserve_interword_spaces:
          '1'
      });


    ocrReady =
      true;


    setStatus(

      '✅ Готово.<br><br>' +
      'Наведи камеру на штрихкод ' +
      'или напечатанный артикул.',

      'search'
    );


    setInterval(
      function() {

        runOcr(
          false
        );

      },
      1900
    );

  }

  catch(err) {

    setStatus(

      '⚠️ OCR не загрузился, ' +
      'но штрихкоды можно сканировать.',

      'warn'
    );
  }
}


/* =========================
   CAMERA FRAME
========================= */

function getFrame() {

  const video =
    document.querySelector(
      '#reader video'
    );


  if (
    !video ||
    !video.videoWidth
  ) {
    return null;
  }


  const canvas =
    document
      .createElement(
        'canvas'
      );


  const ctx =
    canvas
      .getContext(
        '2d'
      );


  const width =
    video.videoWidth *
    .95;


  const height =
    video.videoHeight *
    .82;


  const x =
    (
      video.videoWidth -
      width
    ) / 2;


  const y =
    (
      video.videoHeight -
      height
    ) / 2;


  canvas.width =
    width * 1.4;


  canvas.height =
    height * 1.4;


  ctx.drawImage(

    video,

    x,
    y,
    width,
    height,

    0,
    0,
    canvas.width,
    canvas.height
  );


  return canvas;
}


/* =========================
   OCR
========================= */

async function runOcr(
  forced
) {

  if (
    !ocrReady ||
    ocrBusy ||
    serverBusy
  ) {
    return;
  }


  if (
    !forced &&
    Date.now() <
      cooldownUntil
  ) {
    return;
  }


  const frame =
    getFrame();


  if (!frame) {
    return;
  }


  ocrBusy =
    true;


  try {

    const result =
      await ocrWorker
        .recognize(
          frame
        );


    const text =
      result.data.text ||
      '';


    const match =
      findArticle(
        text
      );


    if (!match) {

      if (forced) {

        setStatus(

          '🔍 Артикул не найден.<br><br>' +
          'Поднеси этикетку ближе и держи ровно.',

          'warn'
        );
      }


      return;
    }


    const now =
      Date.now();


    if (
      match.article ===
        lastArticle &&
      now -
        lastArticleTime
      <
      2600
    ) {
      return;
    }


    lastArticle =
      match.article;


    lastArticleTime =
      now;


    serverBusy =
      true;


    setStatus(

      '🔍 Найден артикул:<br>' +

      '<b>' +
      escapeHtml(
        match.article
      ) +
      '</b><br>' +

      escapeHtml(
        match.name
      ) +

      '<br><br>Проверяю…',

      'search'
    );


    let response;


    if (
      pendingBarcode
    ) {

      response =
        await api(

          'bind',

          {
            barcode:
              pendingBarcode,

            article:
              match.article
          }
        );

    }

    else {

      response =
        await api(

          'ocr',

          {
            article:
              match.article
          }
        );
    }


    handleResult(
      response.result
    );

  }

  catch(err) {

    serverBusy =
      false;


    showError(
      err
    );

  }

  finally {

    ocrBusy =
      false;
  }
}


/* =========================
   OCR MATCH
========================= */

function normalize(
  value
) {

  return String(
    value || ''
  )
    .toUpperCase()
    .replace(
      /[^A-ZА-Я0-9]/g,
      ''
    );
}


function getCandidates(
  text
) {

  const parts =
    String(
      text || ''
    )
      .toUpperCase()
      .replace(
        /[^A-ZА-Я0-9\-./\s]/g,
        ' '
      )
      .split(/\s+/)
      .map(
        normalize
      )
      .filter(Boolean);


  const set =
    new Set();


  for (
    let i = 0;
    i < parts.length;
    i++
  ) {

    for (
      let count = 1;
      count <= 3;
      count++
    ) {

      if (
        i + count >
        parts.length
      ) {
        break;
      }


      const value =
        parts
          .slice(
            i,
            i + count
          )
          .join('');


      if (
        value.length >= 3
      ) {

        set.add(
          value
        );
      }
    }
  }


  return [
    ...set
  ];
}


function findArticle(
  text
) {

  const full =
    normalize(
      text
    );


  const candidates =
    getCandidates(
      text
    );


  const matches =
    [];


  catalog.forEach(
    function(item) {

      const article =
        normalize(
          item.article
        );


      if (!article) {
        return;
      }


      const numeric =
        /^\d+$/
          .test(
            article
          );


      let found =
        false;


      /*
       * Короткие цифровые артикула
       * нельзя искать внутри EAN.
       */
      if (
        numeric &&
        article.length <= 6
      ) {

        found =
          candidates
            .includes(
              article
            );

      }

      else {

        found =
          full.includes(
            article
          )
          ||
          candidates.includes(
            article
          );
      }


      if (found) {

        matches.push({

          article:
            item.article,

          name:
            item.name,

          length:
            article.length
        });
      }
    }
  );


  if (
    !matches.length
  ) {
    return null;
  }


  matches.sort(
    function(a, b) {

      return (
        b.length -
        a.length
      );
    }
  );


  return matches[0];
}


/* =========================
   RESULT
========================= */

function handleResult(
  res
) {

  serverBusy =
    false;


  if (
    res.summary
  ) {

    updateSummary(
      res.summary
    );
  }


  if (
    res.type ===
    'unknown'
  ) {

    pendingBarcode =
      res.barcode;


    setStatus(

      '📦 Штрихкод считан:<br>' +

      '<b>' +
      escapeHtml(
        res.barcode
      ) +
      '</b><br><br>' +

      'Теперь автоматически ищу ' +
      'артикул на этой же этикетке.',

      'warn'
    );


    setTimeout(
      function() {

        runOcr(
          true
        );

      },
      100
    );


    return;
  }


  if (
    res.type ===
      'complete'
    ||
    res.type ===
      'partial'
  ) {

    const complete =
      res.type ===
      'complete';


    setStatus(

      (
        complete
          ?
          '✅ '
          :
          '🟡 '
      ) +

      '<b>' +
      escapeHtml(
        res.name
      ) +
      '</b><br><br>' +

      'Артикул: <b>' +
      escapeHtml(
        res.article
      ) +
      '</b><br>' +

      'Нужно: ' +
      res.expected +
      '<br>' +

      'Принято: <b>' +
      res.accepted +
      '</b><br>' +

      'Осталось: <b>' +
      res.remaining +
      '</b>',

      complete
        ?
        'ok'
        :
        'warn'
    );


    pendingBarcode =
      '';


    cooldownUntil =
      Date.now() +
      2800;


    vibrate(
      [80,60,80]
    );


    return;
  }


  if (
    res.type ===
    'extra'
  ) {

    setStatus(

      '⚠️ <b>ЛИШНЯЯ ЕДИНИЦА</b><br><br>' +

      escapeHtml(
        res.name
      ) +

      '<br>Уже принято: ' +
      res.accepted +
      ' из ' +
      res.expected,

      'bad'
    );


    pendingBarcode =
      '';


    cooldownUntil =
      Date.now() +
      3500;


    return;
  }


  if (
    res.type ===
    'conflict'
  ) {

    setStatus(

      '❌ Конфликт штрихкода.<br><br>' +

      'Он уже привязан к ' +

      '<b>' +
      escapeHtml(
        res.mappedArticle
      ) +
      '</b>',

      'bad'
    );


    pendingBarcode =
      '';


    return;
  }


  setStatus(

    '❌ Товар не найден',

    'bad'
  );
}


/* =========================
   UI
========================= */

function updateSummary(
  data
) {

  if (!data) {
    return;
  }


  document
    .getElementById(
      'accepted'
    )
    .textContent =
    data.accepted;


  document
    .getElementById(
      'expected'
    )
    .textContent =
    data.expected;


  document
    .getElementById(
      'remaining'
    )
    .textContent =
    data.remaining;
}


function setStatus(
  html,
  type
) {

  document
    .getElementById(
      'statusCard'
    )
    .className =
    'card ' +
    type;


  document
    .getElementById(
      'status'
    )
    .innerHTML =
    html;
}


function showError(
  error
) {

  serverBusy =
    false;


  setStatus(

    '❌ ' +
    escapeHtml(
      error.message ||
      String(error)
    ),

    'bad'
  );
}


function escapeHtml(
  value
) {

  return String(
    value || ''
  )
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    );
}


function vibrate(
  pattern
) {

  try {

    navigator.vibrate(
      pattern
    );

  } catch(e) {}
}


/* =========================
   AUTO LOGIN
========================= */

window.onload =
  async function() {

    if (!accessPin) {
      return;
    }


    document
      .getElementById(
        'pin'
      )
      .value =
      accessPin;


    try {

      const response =
        await api(
          'init'
        );


      initApp(
        response.data
      );

    }

    catch(err) {

      localStorage
        .removeItem(
          'warehousePin'
        );


      accessPin =
        '';
    }
  };

</script>
